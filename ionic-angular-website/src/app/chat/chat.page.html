      <!-- <div class="card-element"> -->
        <div class="side-nav">
        <!-- Close button -->
         <div class="close-button-container">
           <img *ngIf="nav"  src="../../assets/icon/shvard_logo.jpg" alt="SHVARD Icon" />
            <ion-button class="settings-button close-button" (click)="toggleNav()">
              <ion-icon [name]="nav ? 'close-outline' : 'menu-outline'"></ion-icon>
            </ion-button>
         </div>

        <!-- Logged in user box -->
        <div class="loged" *ngIf="nav">
          <span class="username">{{ username }}</span>

          <div class="settings-icon">
            <ion-button class="settings-button" (click)="toggleTheme()">
              <ion-icon [name]="isDark ? 'sunny-outline' : 'moon-outline'"></ion-icon>
            </ion-button>

            <ion-button (click)="logout()" class="settings-button logout-button">
              <ion-icon name="log-out-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
        <div class="chat-history" *ngIf="nav">
          <div class="history">
          <ion-card id="title{{-1}}" class="history"         [ngClass]="{ active: isActive(-1) }" >
            <!-- (click)="selectChatbot(-1,-1)" -->
            <p>New Chat</p>
          </ion-card>
          <div *ngFor="let chat of chats; index as i">
            <ion-card id="title{{i}}" class="history"         [ngClass]="{ active: isActive(i) }" >
               <!-- (click)="selectChatbot(chat.title_id,i)" -->
              <p>{{chat.title}}</p>
            </ion-card>
          </div>
        </div>
        </div>
        </div>
      <!-- </div> -->

      <!-- <div class="card-element"> -->
        <app-loader *ngIf="loading"></app-loader>
        <div class="element-content element-content-chat">
          <div class="chat-container">
            <div class="dropdown">
            <h1 class="dropdown-toggle" (click)="toggleDropdown()">
             {{ getChatbotName(selectedChatbot) }} ▼
            </h1>
          <ul class="dropdown-menu" *ngIf="dropdownOpen">
            <li *ngIf="selectedChatbot !== 'law'" (click)="selectChatbot('law')">Law ChatBot</li>
            <li *ngIf="selectedChatbot !== 'pdb'" (click)="selectChatbot('pdb')">Property Dispute Bot</li>
            <li *ngIf="selectedChatbot !== 'dss'" (click)="selectChatbot('dss')">Decision Support System</li>
          </ul>
        </div>
              <app-lawchat *ngIf="selectedChatbot === 'law'"></app-lawchat>
              <app-pdb *ngIf="selectedChatbot === 'pdb'"></app-pdb>
              <app-dss *ngIf="selectedChatbot === 'dss'"></app-dss>
            </div>
          </div>
      </div>
</ion-content>
